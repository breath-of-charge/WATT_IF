name: Label automation

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - .github/workflows/label-automation.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply repository labels
    runs-on: ubuntu-24.04

    steps:
      - name: Create labels and apply matching labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const labelCatalog = [
              { name: "type: init", color: "8250DF", description: "프로젝트 초기 설정" },
              { name: "type: feat", color: "1F883D", description: "새로운 기능" },
              { name: "type: fix", color: "D1242F", description: "버그 수정" },
              { name: "type: refactor", color: "BF8700", description: "리팩토링" },
              { name: "type: chore", color: "656D76", description: "기타 설정 및 유지보수" },
              { name: "type: docs", color: "0969DA", description: "문서 작업" },
              { name: "type: ci", color: "0A3069", description: "CI 및 자동화" },
              { name: "area: config", color: "D4C5F9", description: "프로젝트 및 GitHub 설정" },
              { name: "area: ui", color: "F9D0C4", description: "UI 및 Compose" },
              { name: "area: domain", color: "FEF2C0", description: "도메인 모델 및 로직" },
              { name: "area: data", color: "C2E0C6", description: "데이터 및 저장소" },
              { name: "area: vehicle", color: "BFDADC", description: "차량 SDK 연동" },
              { name: "area: docs", color: "C5DEF5", description: "프로젝트 문서" },
              { name: "member: 우재 🐶", color: "FBCA04", description: "담당자: 우재" },
              { name: "member: 예찬 🦊", color: "FAD8C7", description: "담당자: 예찬" },
              { name: "member: 현영 🐱", color: "B60205", description: "담당자: 현영" },
            ];

            for (const label of labelCatalog) {
              try {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            if (!context.payload.issue && !context.payload.pull_request) return;

            const typeLabels = labelCatalog
              .map((label) => label.name)
              .filter((name) => name.startsWith("type: "));
            const areaLabels = labelCatalog
              .map((label) => label.name)
              .filter((name) => name.startsWith("area: "));
            const memberLabels = labelCatalog
              .map((label) => label.name)
              .filter((name) => name.startsWith("member: "));
            const typeByKey = {
              init: "type: init",
              feat: "type: feat",
              fix: "type: fix",
              refactor: "type: refactor",
              chore: "type: chore",
              docs: "type: docs",
              ci: "type: ci",
            };
            const memberByLogin = {
              juwoojae: "member: 우재 🐶",
              metjyc: "member: 예찬 🦊",
              hycho04: "member: 현영 🐱",
            };

            const item = context.payload.issue ?? context.payload.pull_request;
            const issue_number = item.number;
            const currentLabels = new Set(item.labels.map((label) => label.name));
            const labelsToRemove = new Set([...typeLabels, ...memberLabels]);
            const labelsToAdd = new Set();
            const memberLabel = memberByLogin[item.user.login];
            if (memberLabel) labelsToAdd.add(memberLabel);

            if (context.payload.issue) {
              const titleType = item.title.match(/^\[(Init|Feat|Fix|Refactor|Chore|Docs|CI)]/i);
              if (titleType) labelsToAdd.add(typeByKey[titleType[1].toLowerCase()]);
            }

            if (context.payload.pull_request) {
              areaLabels.forEach((label) => labelsToRemove.add(label));

              const branchType = item.head.ref.match(/^(init|feat|fix|refactor|chore|docs|ci)\//i);
              if (branchType) labelsToAdd.add(typeByKey[branchType[1].toLowerCase()]);

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: item.number,
                per_page: 100,
              });

              for (const { filename } of files) {
                if (
                  filename.startsWith(".github/") ||
                  filename === ".editorconfig" ||
                  filename === "gradle.properties" ||
                  filename === "settings.gradle.kts" ||
                  filename === "build.gradle.kts" ||
                  filename === "app/build.gradle.kts" ||
                  filename.startsWith("gradle/")
                ) {
                  labelsToAdd.add("area: config");
                }

                if (filename.includes("/ui/")) labelsToAdd.add("area: ui");
                if (filename.includes("/domain/")) labelsToAdd.add("area: domain");
                if (filename.includes("/data/vehicle/")) {
                  labelsToAdd.add("area: vehicle");
                } else if (filename.includes("/data/")) {
                  labelsToAdd.add("area: data");
                }
                if (filename.endsWith(".md") || filename.startsWith("docs/")) {
                  labelsToAdd.add("area: docs");
                }
              }
            }

            for (const label of labelsToRemove) {
              if (!currentLabels.has(label) || labelsToAdd.has(label)) continue;
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [...labelsToAdd],
              });
            }
