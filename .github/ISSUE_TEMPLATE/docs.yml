name: 📝 문서 작업
description: 문서 작성 및 수정 작업을 등록합니다.
title: "[Docs] "
labels: []
body:
  - type: textarea
    id: work
    attributes:
      label: 📝 문서 작업 내용
      description: 작성하거나 수정할 문서와 작업 목적을 설명해 주세요.
      placeholder: README에 프로젝트 실행 방법을 추가합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 📌 세부 작업
      description: 수행할 작업을 체크리스트로 작성해 주세요.
      placeholder: "- [ ] 문서 내용 작성\n- [ ] 링크 확인"
    validations:
      required: true

  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치 기능명
      description: 이슈 번호를 제외하고 영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요.
      placeholder: update-readme
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 🔗 참고 자료
      description: 참고할 문서나 링크가 있다면 첨부해 주세요.

