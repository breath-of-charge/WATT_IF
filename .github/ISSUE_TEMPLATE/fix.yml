name: 🐛 버그 수정
description: 오류와 수정 작업을 등록합니다.
title: "[Fix] "
labels: []
body:
  - type: textarea
    id: work
    attributes:
      label: 🐛 오류 내용
      description: 발생한 오류와 기대한 동작을 설명해 주세요.
      placeholder: 캠핑 상태가 앱 재실행 후 복원되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 📌 세부 작업
      description: 확인하거나 수정할 작업을 체크리스트로 작성해 주세요.
      placeholder: "- [ ] 원인 확인\n- [ ] 오류 수정\n- [ ] 재현 테스트"
    validations:
      required: true

  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치 기능명
      description: 이슈 번호를 제외하고 영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요.
      placeholder: camping-state-restore
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 🔗 참고 자료
      description: 오류 화면, 로그 또는 관련 문서를 첨부해 주세요.

