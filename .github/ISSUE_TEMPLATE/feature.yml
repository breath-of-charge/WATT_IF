name: ✨ Feat
description: 새로운 기능이나 화면 구현 작업을 등록합니다.
title: "[Feat] "
labels: []
body:
  - type: textarea
    id: work
    attributes:
      label: 🛠️ 작업 내용
      description: 구현할 기능과 작업 목적을 설명해 주세요.
      placeholder: 배터리 상태 화면을 구현합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 📌 세부 작업
      description: 수행할 작업을 체크리스트로 작성해 주세요.
      placeholder: "- [ ] UI 구현\n- [ ] 상태 처리\n- [ ] 테스트"
    validations:
      required: true

  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치 기능명
      description: 이슈 번호를 제외하고 영문 소문자, 숫자, 하이픈(-)으로 작성해 주세요.
      placeholder: battery-screen
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 🔗 참고 자료
      description: 관련 디자인이나 문서가 있다면 첨부해 주세요.

